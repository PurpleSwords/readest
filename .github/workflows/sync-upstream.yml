name: Sync upstream mirror

on:
  schedule:
    # 04:23 Asia/Shanghai (UTC+8), away from the top of the hour.
    - cron: '23 20 * * *'
  workflow_dispatch:

# The mirror is pushed with a write-scoped deploy key, not GITHUB_TOKEN:
# GitHub refuses App tokens that touch .github/workflows/* (upstream moves
# those files periodically), so the token only needs read access here.
permissions:
  contents: read

concurrency:
  group: sync-upstream-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'PurpleSwords/readest'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fork history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: Fast-forward the upstream mirror
        shell: bash
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_DEPLOY_KEY:-}" ]; then
            echo "::error::Repository secret SYNC_DEPLOY_KEY is missing; the mirror cannot be pushed."
            exit 1
          fi

          key_file="$RUNNER_TEMP/sync_deploy_key"
          printf '%s\n' "$SYNC_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git remote add upstream https://github.com/readest/readest.git
          git fetch --no-tags upstream main
          upstream_sha=$(git rev-parse refs/remotes/upstream/main)

          # No force push: fail if someone puts fork-only commits on the mirror
          # or upstream rewrites history. main and release tags are untouched.
          git push git@github.com:PurpleSwords/readest.git "${upstream_sha}:refs/heads/upstream-main"

          {
            echo '### Upstream mirror synchronized'
            echo "- Upstream commit: ${upstream_sha}"
            echo '- Destination: upstream-main'
            echo '- No pull request, main update, tag publication or deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
